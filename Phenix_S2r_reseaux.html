<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phenix_S2r — Mes réseaux</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b1020, #17133b, #24145c);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 34px 25px;
    border-radius: 28px;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    backdrop-filter: blur(12px);
  }
  .logo {
    width: 92px;
    height: 92px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 900;
    box-shadow: 0 0 35px rgba(124,58,237,.5);
  }
  h1 { margin: 5px 0; font-size: 30px; }
  .subtitle { opacity: .78; margin-bottom: 25px; }
  .message {
    margin: 0 auto 24px;
    padding: 15px 18px;
    border-radius: 18px;
    background: rgba(255,255,255,.08);
    font-size: 18px;
    font-weight: 700;
  }
  .buttons { display: grid; gap: 13px; }
  a {
    text-decoration: none;
    color: white;
    padding: 16px 18px;
    border-radius: 15px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.12);
    font-weight: 700;
    transition: transform .18s, background .18s;
  }
  a:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.20);
  }
  .yt { background: rgba(255,0,0,.22); }
  .tt { background: rgba(0,0,0,.30); }
  .ig { background: rgba(225,48,108,.22); }
  .x { background: rgba(0,0,0,.35); }
  footer { margin-top: 24px; opacity: .5; font-size: 12px; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">P</div>
    <h1>Phenix_S2r</h1>
    <div class="subtitle">🎮 Gaming • Toujours plus haut 🚀</div>

    

    <div class="buttons">
      <a class="yt" href="https://www.youtube.com/@Phenix_S2r" target="_blank">▶️ S'abonner à YouTube</a>
      <a class="tt" href="https://www.tiktok.com/@phenix_S2r" target="_blank">🎵 Me suivre sur TikTok</a>
      <a class="ig" href="https://www.instagram.com/phenix_S2r/" target="_blank">📸 Me suivre sur Instagram</a>
      <a class="x" href="https://x.com/Phenix_122" target="_blank">𝕏 Me suivre sur X</a>
    </div>

    <footer>Merci pour le soutien ❤️</footer>
    <div class="message" style="margin-top:18px;margin-bottom:0;">Tu es trop magnifique Karolanne ✨</div>
  </main>
</body>
</html>
